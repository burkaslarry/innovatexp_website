<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<style>
  @page { size: 1080px 1350px; margin: 0; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; background: #05070a; }
  .poster {
    position: relative; width: 1080px; height: 1350px; overflow: hidden;
    font-family: "Songti TC", "Songti SC", "STSong", "Times New Roman", serif;
  }
  .bg {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: 78% 50%;
  }
  .shade {
    position: absolute; inset: 0;

  .content { position: absolute; inset: 0; padding: 92px 88px; }
  .title {
    font-family: "Didot", "Bodoni 72", "Times New Roman", serif;
    font-size: 104px; line-height: 1.02; letter-spacing: -.012em;
    background: linear-gradient(170deg, #FFF8EA 0%, #F3DEB4 38%, #DDB97C 72%, #BE9457 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    text-shadow: 0 2px 24px rgba(0,0,0,.5);
    white-space: nowrap;
  }
  .title span { display: block; }
  .title .line2 { font-size: 84px; letter-spacing: -.02em; margin-top: 6px; }
  .info { margin-top: 66px; font-size: 35px; line-height: 1.66; color: #E8D2A8; letter-spacing: .01em; }
  .info .row { display: flex; }
  .info .k { width: 140px; flex: none; color: #DDC293; }
  .info .v { color: #F4E9D2; }
  .en { font-family: "Didot", "Times New Roman", serif; letter-spacing: .01em; }
  .rule { width: 620px; height: 1px; margin-top: 46px; background: linear-gradient(90deg, rgba(214,176,110,.9), rgba(214,176,110,.12)); }
  .speaker { margin-top: 32px; display: flex; align-items: baseline; }
  .speaker .k { width: 140px; flex: none; font-size: 28px; color: #C6AC7F; letter-spacing: .1em; }
  .speaker .n { font-family: "Didot", "Times New Roman", serif; font-size: 46px; color: #F8EDD6; letter-spacing: .01em; }
  .role { margin-top: 6px; padding-left: 140px; font-size: 24px; color: #CBB388; letter-spacing: .03em; }
  .sponsor { margin-top: 34px; display: flex; align-items: baseline; }

  .sponsor-link { margin-top: 8px; padding-left: 140px; font-family: "Didot", "Times New Roman", serif; font-size: 17px; color: #8C7A58; letter-spacing: .02em; }
  .logo { position: absolute; left: 88px; bottom: 70px; width: 190px; }
  .logo img { width: 100%; display: block; opacity: .95; }
  .tag {
    position: absolute; right: 88px; bottom: 84px;
    font-family: "Didot", "Times New Roman", serif; font-size: 19px; letter-spacing: .34em;
    color: rgba(214,176,110,.7);
